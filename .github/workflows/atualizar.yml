name: Atualizar lista e guia

on:
  schedule:
    - cron: "17 */6 * * *"   # de 6 em 6 horas
  workflow_dispatch:
  push:
    paths: ["gerar.py"]

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I gerar.py
      - name: Guardar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv.m3u epg.xml.gz
          git diff --cached --quiet || git commit -m "Atualizar lista e guia"
          git push
